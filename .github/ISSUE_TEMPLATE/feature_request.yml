name: Feature request
description: Suggest an improvement within the local coding MVP
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the task or workflow that needs improvement.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include constraints or acceptance criteria that would make the change useful.
    validations:
      required: true
