[project]
name = "kanban-agent-board"
version = "0.1.0"
description = "Local coding agent board with isolated Git worktrees and human review"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "third_party/*.LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-openai>=1,<2", "langchain-anthropic>=1,<2", "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/kanban"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
